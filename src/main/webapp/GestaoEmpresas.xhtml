<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core">
<h:head>

<meta charset="UTF-8"/>
<title>Gestão de Empresas</title>

<h:outputStylesheet library="rcostab" name="estilo.css"/>

</h:head>

<body>
	<header>
		<h:graphicImage library="rcostab" name="logo.png"/>
	</header>

	<div id="conteudo">
		<h:form>
			<h:panelGrid columns="2">
			
				<h:outputLabel value="Razão social:" for="razaoSocial"/>
				<h:inputText id="razaoSocial"/>
				
				<h:outputLabel value="Nome fantasia:" for="nomeFantasia"/>
				<h:inputText id="nomeFantasia"/>
				
				<h:outputLabel value="Tipo empresa:" for="tipo"/>
				<h:selectOneMenu id="tipo">
					<f:selectItem itemLabel="Selecione..."/>
					<f:selectItem itemLabel="MEI" itemValue="MEI"/>
					<f:selectItem itemLabel="LTDA" itemValue="LTDA"/>
				</h:selectOneMenu>
							
				<h:outputLabel value="" />
				<h:commandButton value="Salvar"></h:commandButton>
			</h:panelGrid>
			
			<h:dataTable value="#{[0, 0, 0, 0]}">
				<h:column>
					<f:facet name="header">
						<h:outputText value="Razão social"/>
					</f:facet>
					
					<h:outputText value="Rcostab Softwares"/>
				</h:column>
				
				<h:column>
					<f:facet name="header">
						<h:outputText value="Nome fantasia"/>
					</f:facet>
					
					<h:outputText value="Softwares"/>
				</h:column>
				
				<h:column>
					<f:facet name="header">
						<h:outputText value="Tipo empresa"/>
					</f:facet>
					
					<h:outputText value="Rcostab"/>
				</h:column>
			</h:dataTable>
		</h:form>
	</div>
	
	<footer>
		Curso online "JSF e PrimeFaces Essencial"
	</footer>
</body>
</html>
