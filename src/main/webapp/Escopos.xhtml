<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core">
<h:head>

<meta charset="UTF-8"/>
<title>Gestão de Empresas</title>

<h:outputStylesheet library="rcostab" name="estilo.css"/>

</h:head>

<body>
	<header>
		<h:graphicImage library="rcostab" name="logo.png"/>
	</header>

	<div id="conteudo">
		<h:form>
			<h:panelGrid columns="2">
			
				<h:outputLabel value="Número:"/>
				<h:outputText value="#{gestaoEmpresasBean.numero}"/>
							
				<h:outputLabel value="" />
				<h:commandButton value="Salvar"></h:commandButton>
			</h:panelGrid>
			
		</h:form>
	</div>
	
	<footer>
		Curso online "JSF e PrimeFaces Essencial"
	</footer>
</body>
</html>
